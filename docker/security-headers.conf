# Headers de segurança (espelham o arquivo _headers Netlify/Cloudflare).
# Incluído em cada location porque, no Nginx, um add_header em nível de location
# substitui (não herda) os add_header do server. HSTS começa em 180 dias;
# após validar o HTTPS em produção, suba max-age para 31536000 e adicione "preload".
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
